<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Activități</title>
    <link rel="stylesheet" href="listaActivitati.css">
</head>
<body>

    <div class="card">
        <h1>Lista mea de activități</h1>
        
        <p>Introduceți o nouă sarcină în câmpul de mai jos și apăsați butonul pentru a o salva în listă.</p>
        
        <div class="input-group">
            <input type="text" id="inputActivitate" placeholder="Scrie activitatea aici...">
            <button id="btnAdauga">Adaugă activitate</button>
        </div>

        <ul id="listaActivitati"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
