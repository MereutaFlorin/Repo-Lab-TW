<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalii Produs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 style="text-align: center; color: #333;">Detalii produs</h1>

    <div class="product-card">
        <h2>Telefon X </h2>
        
       

        <button id="btnDetalii">Afișează detalii</button>

        <div id="detalii">
            <p class="descriere">
                Acesta este cel mai nou model de telefon, echipat cu un procesor ultra-rapid, 
                cameră de 108MP și o baterie care durează 36 de ore. Ideal pentru gaming și fotografie.
            </p>
            
            <p class="data-info">
                Informațiile sunt valabile la data: <span id="dataProdus"></span>
            </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
